include "application"

# The library ships no serializer binding — the consuming service declares
# bindings for the wire types it sends; these are the bindings this entity
# requires, exercised here exactly as a consumer's config would supply them.
pekko.actor.serialization-bindings {
  "com.tomshley.boilerplate.jvm.reqreply.Idempotent$Command" = jackson-cbor
  "com.tomshley.boilerplate.jvm.reqreply.Idempotent$Summary" = jackson-cbor
}
