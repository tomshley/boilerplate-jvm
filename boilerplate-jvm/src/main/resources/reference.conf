tomshley-boilerplate-reqreply-idempotency.ask-timeout = 5 s
tomshley-boilerplate-reqreply-idempotency.ask-timeout = ${?TOMSHLEY_BOILERPLATE_REQREPLY_IDEMPOTENCY_ASK_TIMEOUT}

# Signed-value keys are deployment secrets: hex-encoded, by slot (0..31), e.g.
#   tomshley-boilerplate-reqreply-signing.keys.1 = "<openssl rand -hex 32>"
# No default key material ships here on purpose — unconfigured deployments
# sign nothing and verify nothing.
tomshley-boilerplate-reqreply-signing.keys {}
tomshley-boilerplate-reqreply-signing.grace = 0 s
tomshley-boilerplate-reqreply-signing.grace = ${?TOMSHLEY_BOILERPLATE_REQREPLY_SIGNING_GRACE}

pekko.actor.serialization-bindings {
  "com.tomshley.boilerplate.jvm.reqreply.CborSerializable" = jackson-cbor
}
