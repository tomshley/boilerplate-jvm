# ---------------------------------------------------------------------------
# Shared CI/CD templates from cicd-pipelines
# ---------------------------------------------------------------------------
include:
  - project: 'tomshley/brands/global/tware/tech/products/provisioning/cicd-pipelines'
    ref: 'v0.5.5'
    file: '/adapters/gitlab/ci/adapter.yml'

variables:
  CICD_PIPELINES_RUNNER_TAG: "0.5.5"
  SBT_OPTS: "-Xmx2G -Dsbt.log.noformat=true"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
build-sbt:
  image: ${CICD_PIPELINES_REGISTRY}/cicd-runner-sbtdockertofu:${CICD_PIPELINES_RUNNER_TAG}
  tags:
    - saas-linux-medium-amd64
  stage: build
  script:
    - sbt compile

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------
test-sbt:
  image: ${CICD_PIPELINES_REGISTRY}/cicd-runner-sbtdockertofu:${CICD_PIPELINES_RUNNER_TAG}
  tags:
    - saas-linux-medium-amd64
  stage: test
  needs: ["build-sbt"]
  script:
    - sbt test

# ---------------------------------------------------------------------------
# Maven Publish
# ---------------------------------------------------------------------------
publish-maven:
  image: ${CICD_PIPELINES_REGISTRY}/cicd-runner-sbtdockertofu:${CICD_PIPELINES_RUNNER_TAG}
  tags:
    - saas-linux-medium-amd64
  extends:
    - .before-artifact-tags
    - .flow-artifact-publish
  before_script:
    - !reference [.tomshley-cicd-secure-files, before_script]
    - !reference [.before-artifact-tags, before_script]
    - |
      if [ -f ".secure_files/.env" ]; then
        set -a
        source .secure_files/.env
        set +a
      fi
  script:
    - export TOMSHLEY_CICD_BUILD_REVISION="$CICD_PUBLISH_PINNABLE_TAG"
    - sbt publish
    - |
      if [ "$CICD_PUBLISH_ROLLING" = "true" ]; then
        export TOMSHLEY_CICD_BUILD_REVISION="$CICD_PUBLISH_ROLLING_TAG"
        sbt publish
      fi
